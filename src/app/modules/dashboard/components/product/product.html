<div style="padding: 20px;">
  <h2 style="text-align: center; margin-bottom: 20px;">Listado de Productos</h2>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <!-- Buscador -->
    <mat-form-field appearance="fill" style="width: 300px;">
      <mat-label>Buscar Productos</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Búsqueda de producto">
    </mat-form-field>

    <!-- Botón Agregar (Modificado con evento click) -->
    <button mat-raised-button color="primary" (click)="openDialog()">Agregar Producto</button>
  </div>

  <!-- Tabla de Material -->
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%;">

    <!-- Columna ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> No. </th>
      <td mat-cell *matCellDef="let element"> {{element.id}} </td>
    </ng-container>

    <!-- Columna Nombre -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Nombre </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <!-- Columna Precio -->
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef> Precio </th>
      <td mat-cell *matCellDef="let element"> ${{element.price}} </td>
    </ng-container>

    <!-- Columna Stock (account) -->
    <ng-container matColumnDef="account">
      <th mat-header-cell *matHeaderCellDef> Stock </th>
      <td mat-cell *matCellDef="let element"> {{element.account}} </td>
    </ng-container>

    <!-- Columna Categoría -->
    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef> Categoría </th>
      <td mat-cell *matCellDef="let element"> {{element.category?.name}} </td>
    </ng-container>

    <!-- Columna Imagen -->
    <ng-container matColumnDef="picture">
      <th mat-header-cell *matHeaderCellDef> Imagen </th>
      <td mat-cell *matCellDef="let element">
        <!-- Renderizamos el Base64 a imagen -->
        <img *ngIf="element.picture" [src]="'data:image/jpeg;base64,' + element.picture" 
             style="width: 50px; height: 50px; object-fit: cover; border-radius: 5px; margin-top: 5px;">
        <span *ngIf="!element.picture">Sin imagen</span>
      </td>
    </ng-container>

    <!-- Columna Acciones (Modificado con eventos click) -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let element">
        <!-- Botón Editar -->
        <button mat-icon-button color="accent" (click)="edit(element)">
          <mat-icon>edit</mat-icon>
        </button>
        <!-- Botón Eliminar -->
        <button mat-icon-button color="warn" (click)="delete(element.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Renderizado de las filas -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
