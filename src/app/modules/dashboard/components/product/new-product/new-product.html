<h2 mat-dialog-title>{{ estadoFormulario }} Producto</h2>

<mat-dialog-content>
  <form [formGroup]="productForm">
    <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 10px;">
      
      <mat-form-field appearance="fill">
        <mat-label>Nombre del Producto</mat-label>
        <input matInput formControlName="name" required>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Precio</mat-label>
        <input matInput type="number" formControlName="price" required>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Stock en Inventario</mat-label>
        <input matInput type="number" formControlName="account" required>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Categoría</mat-label>
        <mat-select formControlName="categoryId" required>
          <mat-option *ngFor="let cat of categorias" [value]="cat.id">
            {{ cat.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <div style="margin-top: 5px;">
        <label style="display: block; font-weight: bold; margin-bottom: 10px;">Imagen del producto:</label>
        
        <div *ngIf="data?.picture && !imagenSeleccionada" style="margin-bottom: 10px;">
          <span style="font-size: 12px; color: gray;">Imagen actual:</span>
          <img [src]="'data:image/jpeg;base64,' + data.picture" 
               style="width: 80px; height: 80px; object-fit: cover; display: block; border: 1px solid #ddd; border-radius: 5px;">
        </div>

        <input type="file" (change)="onFileSelected($event)" accept="image/*">
        
        <p *ngIf="data && !imagenSeleccionada" style="font-size: 11px; color: #666; margin-top: 5px;">
          * Si no seleccionas un archivo, se mantendrá la imagen actual.
        </p>
      </div>

    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button color="warn" (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="productForm.invalid">Guardar</button>
</mat-dialog-actions>
