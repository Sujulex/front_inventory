<div style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f5f5f5;">
  <mat-card style="width: 400px; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
    
    <mat-card-header style="display: flex; justify-content: center; margin-bottom: 20px;">
      <mat-card-title style="font-size: 24px; font-weight: bold;">Iniciar Sesión</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" style="display: flex; flex-direction: column; gap: 15px;">
        
        <div *ngIf="errorMessage" style="color: white; background-color: #f44336; padding: 10px; border-radius: 4px; text-align: center; font-size: 14px;">
          {{ errorMessage }}
        </div>

        <mat-form-field appearance="fill">
          <mat-label>Usuario o Correo</mat-label>
          <input matInput formControlName="username" required autocomplete="username">
          <mat-icon matPrefix style="margin-right: 10px;">person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Contraseña</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" required autocomplete="current-password">
          <mat-icon matPrefix style="margin-right: 10px;">lock</mat-icon>
          <button type="button" mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Ocultar contraseña'">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid" style="padding: 20px 0; font-size: 16px;">
          Ingresar
        </button>

      </form>
    </mat-card-content>

  </mat-card>
</div>
